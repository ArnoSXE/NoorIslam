<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbeeh | NoorIslam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tasbeeh-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem 0 6rem;
      text-align: center;
    }
    .counter-display {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 4px solid var(--pk-gold);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(212,175,55,0.2), inset 0 0 20px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    .counter-display::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 30%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
    }
    .count-value {
      font-size: 6rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--text-main);
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      line-height: 1;
    }
    #activeDhikr {
      font-family: var(--font-arabic);
      font-size: 2rem;
      color: var(--pk-gold);
      margin-top: 1rem;
      min-height: 2.5rem;
    }
    .tap-area {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
      border: 5px solid #475569;
      margin: 0 auto 2rem;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5), inset 0 -10px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }
    .tap-area:active {
      transform: scale(0.95);
      box-shadow: 0 10px 15px rgba(0,0,0,0.5), inset 0 -5px 10px rgba(0,0,0,0.8);
    }
    .tap-area::after {
      content: 'TAP';
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-weight: 700;
      font-size: 2rem;
      color: rgba(255,255,255,0.1);
      pointer-events: none;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .dhikr-options {
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .dhikr-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-family: var(--font-arabic);
      font-size: 1.2rem;
      transition: var(--transition);
    }
    .dhikr-btn:hover, .dhikr-btn.active {
      background: rgba(212,175,55,0.2);
      border-color: var(--pk-gold);
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <!-- ... same navbar ... -->
    <div class="nav-container">
      <div class="nav-logo"><div class="logo-icon">☪</div><span class="logo-text">NoorIslam</span></div>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a><a href="quran.html" class="nav-link">Quran</a><a href="hadith.html" class="nav-link">Hadith</a><a href="prayer.html" class="nav-link">Prayer Times</a><a href="qibla.html" class="nav-link">Qibla</a><a href="tasbeeh.html" class="nav-link active">Tasbeeh</a><a href="names.html" class="nav-link">99 Names</a>
      </div>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1 class="page-title">Digital Tasbeeh</h1>
      <p class="page-subtitle">"Remember Allah much so that you may be successful" - [8:45]</p>
    </div>
  </header>

  <main class="container">
    <div class="tasbeeh-container">
      
      <div class="dhikr-options" id="dhikrOptions">
        <button class="dhikr-btn active" data-dhikr="سُبْحَانَ اللّٰهِ">Subhanallah</button>
        <button class="dhikr-btn" data-dhikr="الْحَمْدُ لِلّٰهِ">Alhamdulillah</button>
        <button class="dhikr-btn" data-dhikr="اللّٰهُ أَكْبَرُ">Allahu Akbar</button>
        <button class="dhikr-btn" data-dhikr="لَا إِلَٰهَ إِلَّا اللّٰهُ">La ilaha illallah</button>
        <button class="dhikr-btn" data-dhikr="أَسْتَغْفِرُ اللّٰهَ">Astaghfirullah</button>
      </div>

      <div class="counter-display">
        <div class="count-value" id="countDisplay">000</div>
        <div id="activeDhikr">سُبْحَانَ اللّٰهِ</div>
      </div>

      <div class="tap-area" id="tapArea"></div>

      <div class="controls">
        <button class="btn-secondary" id="resetBtn">↻ Reset</button>
      </div>

    </div>
  </main>
  
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let count = 0;
    const countDisplay = document.getElementById('countDisplay');
    const tapArea = document.getElementById('tapArea');
    const resetBtn = document.getElementById('resetBtn');
    const dhikrOptions = document.querySelectorAll('.dhikr-btn');
    const activeDhikrLabel = document.getElementById('activeDhikr');

    function updateDisplay() {
        countDisplay.textContent = count.toString().padStart(3, '0');
        // Vibrate on milestones
        if ('vibrate' in navigator) {
            if (count > 0 && count % 33 === 0) {
                navigator.vibrate([100, 50, 100]); // double pulse
            } else {
                navigator.vibrate(20); // short pulse
            }
        }
    }

    tapArea.addEventListener('click', () => {
        count++;
        updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
        if(confirm("Reset counter to zero?")) {
            count = 0;
            updateDisplay();
        }
    });

    dhikrOptions.forEach(btn => {
        btn.addEventListener('click', (e) => {
            dhikrOptions.forEach(b => b.classList.remove('active'));
            const target = e.target;
            target.classList.add('active');
            activeDhikrLabel.textContent = target.dataset.dhikr;
        });
    });
  </script>
</body>
</html>
